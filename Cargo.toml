[workspace]
members = ["crates/core", "crates/providers", "crates/transports", "crates/runtime", "apps/desktop/src-tauri"]
default-members = ["crates/core", "crates/providers", "crates/transports", "crates/runtime"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
panic = "abort"
